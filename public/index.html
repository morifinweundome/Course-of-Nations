<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Course of Nations</title>
<meta name="description" content="Turn-based strategy games of statecraft, played on Discord.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0e1116; --panel: #161b22; --line: #2a313c;
    --text: #e6e2d8; --muted: #9aa3ad; --accent: #c9a24a; --accent-ink: #1a1405;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 16px/1.55 Inter, system-ui, sans-serif; }
  .wrap { max-width: 880px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--line); }
  .brand { font-family: "Cormorant Garamond", serif; font-size: 1.5rem; font-weight: 600; letter-spacing: .02em; }
  .user { display: flex; gap: 12px; align-items: center; color: var(--muted); font-size: .9rem; }
  .user img { width: 28px; height: 28px; border-radius: 50%; }
  .btn { display: inline-block; background: var(--accent); color: var(--accent-ink); border: 0; border-radius: 6px; padding: 10px 18px; font: 600 .95rem Inter, sans-serif; text-decoration: none; cursor: pointer; }
  .btn.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); padding: 6px 12px; font-weight: 500; }
  .hero { padding: 72px 0 48px; text-align: center; }
  .hero h1 { font-family: "Cormorant Garamond", serif; font-size: clamp(2.4rem, 7vw, 4rem); font-weight: 600; margin: 0; }
  .hero .slogan { color: var(--accent); letter-spacing: .08em; text-transform: uppercase; font-size: .8rem; margin: 10px 0 24px; }
  .hero p { color: var(--muted); max-width: 560px; margin: 0 auto 28px; }
  .games { display: grid; gap: 12px; padding-bottom: 64px; }
  .game { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; gap: 16px; flex-wrap: wrap; }
  .game h3 { margin: 0 0 4px; font-size: 1.05rem; }
  .game .meta { color: var(--muted); font-size: .9rem; }
  .badge { font-size: .75rem; color: var(--accent); border: 1px solid var(--accent); border-radius: 999px; padding: 2px 8px; margin-left: 8px; }
  .note { color: var(--muted); text-align: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Course of Nations</div>
    <div class="user" id="user" hidden>
      <img id="avatar" alt="">
      <span id="username"></span>
      <a class="btn ghost" href="/auth/logout">Sign out</a>
    </div>
  </header>

  <section class="hero">
    <h1>Course of Nations</h1>
    <div class="slogan">Chart Your Course · Write Your Story · Build Your Empire</div>
    <p>Turn-based strategy games of statecraft, played on Discord. Found a nation and lead it through economy, diplomacy, ideology, technology and war.</p>
    <a class="btn" id="signin" href="/auth/login" hidden>Sign in with Discord</a>
  </section>

  <section class="games" id="games" hidden></section>
  <p class="note" id="message" hidden></p>
</div>

<script>
(async function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  if (params.get("signin") === "failed") {
    $("message").textContent = "Sign-in did not complete. Please try again.";
    $("message").hidden = false;
  }

  let me = { signedIn: false };
  try { me = await (await fetch("/api/me")).json(); } catch (e) {}

  if (!me.signedIn) { $("signin").hidden = false; return; }

  $("user").hidden = false;
  $("username").textContent = me.name + (me.gm ? " · GM" : "");
  if (me.avatar) $("avatar").src = `https://cdn.discordapp.com/avatars/${me.id}/${me.avatar}.png?size=64`;
  else $("avatar").hidden = true;

  const res = await fetch("/api/games");
  const data = await res.json();
  const games = data.games || [];
  if (!games.length) {
    $("message").textContent = "You are not yet enrolled in any game. Ask the game master to add you.";
    $("message").hidden = false;
    return;
  }
  const box = $("games");
  for (const g of games) {
    const el = document.createElement("div");
    el.className = "game";
    const role = g.nation ? `Playing as ${g.nation}` : (g.gm ? "Game master" : "");
    el.innerHTML = `<div><h3></h3><div class="meta"></div></div><a class="btn" href="${g.page || "#"}?game=${encodeURIComponent(g.id)}">Open</a>`;
    el.querySelector("h3").textContent = g.title;
    if (g.gm) { const b = document.createElement("span"); b.className = "badge"; b.textContent = "GM"; el.querySelector("h3").appendChild(b); }
    el.querySelector(".meta").textContent = g.configured ? `${role} — ${g.tagline}` : `${g.tagline} (not yet connected)`;
    box.appendChild(el);
  }
  box.hidden = false;
})();
</script>
</body>
</html>
